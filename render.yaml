services:
  - type: web
    name: algoquest-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_BACKEND
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_USE_RAPIDAPI
        value: "true"
      - key: ALLOWED_ORIGINS_STR
        value: "https://algoquest-9aab0.web.app,https://algoquest-9aab0.firebaseapp.com"
      - key: SUBMISSION_WORKERS
        value: "1"
      - key: APP_ENV
        value: production
