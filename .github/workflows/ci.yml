name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-code-quality:
    name: Python Linting (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff>=0.3.0

      - name: Run Ruff Lint Checks
        run: ruff check backend/

  security-and-dependencies:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit>=2.7.0

      - name: Audit backend dependencies for known CVEs
        run: pip-audit -r backend/requirements.txt

      - name: Verify no committed secret files
        run: |
          echo "Scanning Git index for accidentally committed credentials or secrets..."
          leaks=$(git ls-files | grep -E "(\.env$|\.env\.local|\.key$|\.pem$|serviceAccount.*\.json|.*service-account.*\.json)" || true)
          if [ -n "$leaks" ]; then
            echo "ERROR: Disallowed secret files tracked in Git:"
            echo "$leaks"
            exit 1
          fi
          echo "No secret files found in git index."

  backend-tests:
    name: Backend Tests & PostgreSQL Integration (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algoquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_BACKEND: supabase
      ALLOW_SAMPLE_ONLY_GRADING: "false"
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/algoquest_test
      TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/algoquest_test
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PG_PORT: 5432
      QUEUE_ENABLE_PG_BACKEND: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Prepare test data fixture
        env:
          HIDDEN_TESTS_SECRET: ${{ secrets.HIDDEN_TEST_CASES_JSON }}
        run: |
          if [ -n "$HIDDEN_TESTS_SECRET" ]; then
            echo "Using private hidden test suite provided via GitHub Secrets."
            echo "$HIDDEN_TESTS_SECRET" > backend/data/hidden_test_cases.json
          elif [ ! -f backend/data/hidden_test_cases.json ]; then
            echo "Secret not set. Generating non-sensitive CI test fixture (174 problems, 4318 cases)..."
            python -c "import json; data = {str(q): [{'stdin': f'ci_in_{q}_{i}\n', 'expectedRaw': '0'} for i in range(11 if q == 161 else (7 if q == 169 else 25))] for q in range(1, 175)}; open('backend/data/hidden_test_cases.json', 'w', encoding='utf-8').write(json.dumps(data))"
          fi

      - name: Run full backend and PostgreSQL integration tests
        run: pytest backend/tests/ -v

  frontend-syntax:
    name: Frontend JavaScript Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend JavaScript syntax
        run: |
          echo "Validating JavaScript syntax for all frontend files in js/..."
          failed=0
          for file in js/*.js; do
            if [ -f "$file" ]; then
              echo "Checking syntax: $file"
              if ! node --check "$file"; then
                echo "SYNTAX ERROR in $file"
                failed=1
              fi
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "Frontend JavaScript syntax check failed."
            exit 1
          fi
          echo "All frontend JavaScript files passed syntax validation."

  docker-build-verification:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image with backend context
        run: |
          echo "Building Docker image using context 'backend' and 'backend/Dockerfile'..."
          docker build -t algoquest-api:ci-test -f backend/Dockerfile backend/
          echo "Docker image built successfully."

      - name: Verify container startup and health probe
        run: |
          echo "Running container in background to verify startup and health endpoint..."
          docker run -d --name test-api -p 8000:8000 \
            -e APP_ENV=test \
            -e DATABASE_BACKEND=supabase \
            algoquest-api:ci-test
          
          success=0
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Container health check passed!"
              success=1
              break
            fi
            echo "Waiting for container to start (attempt $i)..."
            sleep 1
          done

          if [ $success -eq 0 ]; then
            echo "Container health check failed. Dumping logs:"
            docker logs test-api
            exit 1
          fi

          docker stop test-api

  deploy-to-render:
    name: Deploy to Render (Post-CI)
    needs: [lint-and-code-quality, security-and-dependencies, backend-tests, frontend-syntax, docker-build-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment via Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "CI checks passed. Triggering Render deployment hook..."
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Render deploy hook returned HTTP $http_code"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Render deployment triggered successfully."
            else
              echo "WARNING: Render deploy hook returned non-2xx status ($http_code). Check Render hook URL configuration."
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set in repository secrets."
            echo "Render autoDeploy is disabled in render.yaml to guarantee commits failing CI are never deployed."
          fi

